[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dormant-methods"
version = "0.1.0"
description = "Research methods for dormant / backdoor trigger detection in LLMs"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
full = [
    "torch>=2.0",
    "transformers>=4.40",
    "transformer-lens>=2.0",
    "sentence-transformers>=3.0",
    "matplotlib>=3.8",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
